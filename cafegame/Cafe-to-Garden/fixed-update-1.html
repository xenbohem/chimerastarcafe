<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star’s Nocturne Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#160b24;
  --panel:#2a163d;
  --gold:#d8b46a;
  --lav:#cbb7ff;
  --text:#eee6ff;
}
body{
  margin:0;
  background:radial-gradient(circle at top,#2b1742,var(--bg));
  color:var(--text);
  font-family:Georgia,serif;
}

/* OVERLAYS */
.overlay{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.88);
  z-index:50;
}
.box{
  background:rgba(42,22,61,.97);
  border:1px solid var(--gold);
  border-radius:22px;
  padding:28px;
  max-width:420px;
  text-align:center;
}

/* BUTTONS */
button{
  margin-top:12px;
  padding:10px;
  width:100%;
  border-radius:14px;
  border:1px solid var(--lav);
  background:transparent;
  color:var(--lav);
  cursor:pointer;
}
button:hover{background:var(--lav);color:#1b1026}

/* GAME */
#game{
  display:none;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
}
.panel{
  background:rgba(42,22,61,.92);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:18px;
}
.panel h3{text-align:center;color:var(--gold);letter-spacing:3px}

/* MENU */
.menu-item{
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  margin-bottom:8px;
  cursor:pointer;
}
.menu-item:hover{background:rgba(203,183,255,.15)}

/* CUP */
.cup-wrap{position:relative;width:220px;height:220px;margin:auto}
.cup{
  position:absolute; inset:20px;
  border-radius:50%;
  border:2px solid var(--gold);
  overflow:hidden;
}
.steam{
  position:absolute;top:-25px;left:50%;
  width:6px;height:40px;
  background:rgba(255,255,255,.6);
  animation:rise 2s infinite;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(0)}
  50%{opacity:1}
  100%{opacity:0;transform:translateY(-30px)}
}

/* SWIRLS */
.swirl{
  position:absolute; inset:-25%;
  border-radius:50%;
  animation:spin 10s linear infinite;
  mix-blend-mode:screen;
}
@keyframes spin{to{transform:rotate(360deg)}}
.base{background:conic-gradient(#6f4a2d,#3d2412,#6f4a2d)}
.milk{background:conic-gradient(#fff,#e7dcc7,#fff)}
.honey{background:conic-gradient(#ffcc66,#c9952f,#ffcc66)}

/* SPOON */
.spoon{
  position:absolute;
  width:10px;height:120px;
  left:50%;top:12px;
  transform-origin:bottom center;
  background:linear-gradient(to right,#ffdca8,#cfa86a,#ffdca8);
  border-radius:8px;
  filter:blur(.6px);
  display:none;
}
@keyframes stir{
  0%{transform:rotate(-12deg)}
  50%{transform:rotate(12deg)}
  100%{transform:rotate(0)}
}
</style>
</head>

<body>

<!-- NAME -->
<div id="nameOverlay" class="overlay">
  <div class="box">
    <h2>✦ STAR’S NOCTURNE CAFÉ ✦</h2>
    <p>Your name, apprentice?</p>
    <input id="nameInput" placeholder="Your name"
      style="width:100%;padding:10px;border-radius:12px;border:none;">
    <button onclick="start()">Enter the Café</button>
  </div>
</div>

<!-- COMPLETION -->
<div id="completeOverlay" class="overlay" style="display:none">
  <div class="box">
    <h2>✦ Apprenticeship Complete ✦</h2>
    <p id="praiseText"></p>
    <button onclick="window.location.href='milos-garden.html'">
      Visit Milo’s Garden 🌿
    </button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div class="panel">
    <h3>MENU</h3>
    <div class="menu-item" onclick="addBase('Lavender Tea')">Lavender Tea</div>
    <div class="menu-item" onclick="addBase('Café Latte')">Café Latte</div>
    <hr>
    <div class="menu-item" onclick="addInfusion('milk')">Milk</div>
    <div class="menu-item" onclick="addInfusion('honey')">Honey</div>
  </div>

  <div class="panel">
    <h3>Your Cup</h3>
    <div class="cup-wrap">
      <div class="spoon" id="spoon"></div>
      <div class="cup" id="cup"><div class="steam"></div></div>
    </div>
    <button onclick="stir()">Stir</button>
    <button onclick="serve()">Serve</button>
  </div>

  <div class="panel">
    <h3>Customer</h3>
    <p id="order"></p>
    <p id="reaction"></p>
  </div>
</div>

<script>
let playerName="";
let served=0;
let recipe=[];
let ready=false;
let currentOrder="";

const bases=["Lavender Tea","Café Latte"];
const cup=document.getElementById("cup");
const spoon=document.getElementById("spoon");
const order=document.getElementById("order");
const reaction=document.getElementById("reaction");

function start(){
  playerName=document.getElementById("nameInput").value||"Apprentice";
  document.getElementById("nameOverlay").style.display="none";
  document.getElementById("game").style.display="grid";
  nextCustomer();
}

function nextCustomer(){
  recipe=[]; ready=false;
  cup.innerHTML='<div class="steam"></div>';
  spoon.style.display="none";
  currentOrder=bases[Math.floor(Math.random()*bases.length)];
  order.textContent=`Customer ${served+1}: ${currentOrder}`;
  reaction.textContent="";
}

function addBase(b){
  recipe=[b];
  spawn("base");
}

function addInfusion(t){
  recipe.push(t);
  spawn(t);
}

function spawn(cls){
  const s=document.createElement("div");
  s.className="swirl "+cls;
  cup.appendChild(s);
}

function stir(){
  if(!recipe.length||ready) return;
  spoon.style.display="block";
  spoon.style.animation="stir 1s ease-in-out 3";
  setTimeout(()=>ready=true,3000);
}

function serve(){
  if(!ready){
    reaction.textContent="STAR: Stir with intention.";
    return;
  }
  if(recipe[0]!==currentOrder){
    reaction.textContent="STAR: That is not what they ordered.";
    return;
  }

  served++;
  reaction.textContent="Customer: Thank you.";

  if(served>=3){
    setTimeout(complete,1500);
  }else{
    setTimeout(nextCustomer,1500);
  }
}

function complete(){
  document.getElementById("game").style.display="none";
  praiseText.innerHTML=
    `Well done, ${playerName}.<br>
     Three hearts warmed.<br>
     Milo now awaits you.`;
  document.getElementById("completeOverlay").style.display="flex";
}
</script>

</body>
</html>
