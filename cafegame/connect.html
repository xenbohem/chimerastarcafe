<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star’s Nocturne Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#160b24;
  --panel:#2a163d;
  --gold:#d8b46a;
  --lav:#cbb7ff;
  --text:#eee6ff;
}
body{
  margin:0;
  background:radial-gradient(circle at top,#2b1742,var(--bg));
  color:var(--text);
  font-family:Georgia,serif;
}

/* ---------- OVERLAYS ---------- */
.overlay{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.9);
  z-index:50;
}
.box{
  background:rgba(42,22,61,.97);
  border:1px solid var(--gold);
  border-radius:22px;
  padding:28px;
  max-width:420px;
  text-align:center;
}

/* ---------- BUTTONS ---------- */
button{
  margin-top:12px;
  padding:10px;
  width:100%;
  border-radius:14px;
  border:1px solid var(--lav);
  background:transparent;
  color:var(--lav);
  cursor:pointer;
}
button:hover{background:var(--lav);color:#1b1026}

/* ---------- GAME LAYOUT ---------- */
#game{
  display:none;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
}
.panel{
  background:rgba(42,22,61,.92);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:18px;
}
.panel h3{
  text-align:center;
  color:var(--gold);
  letter-spacing:3px;
}

/* ---------- MENU ---------- */
.item{
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  margin-bottom:8px;
  cursor:pointer;
}
.item:hover{background:rgba(203,183,255,.2);}

/* ---------- CUP ---------- */
.cup-wrap{position:relative;width:220px;height:220px;margin:auto;}
.cup{
  position:absolute; inset:20px;
  border-radius:50%;
  border:2px solid var(--gold);
  overflow:hidden;
}
.steam{
  position:absolute;top:-25px;left:50%;
  width:6px;height:40px;
  background:rgba(255,255,255,.6);
  animation:rise 2s infinite;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(0)}
  50%{opacity:1}
  100%{opacity:0;transform:translateY(-30px)}
}

/* ---------- SWIRL ---------- */
.swirl{
  position:absolute; inset:-25%;
  border-radius:50%;
  animation:spin 10s linear infinite;
  mix-blend-mode:screen;
}
@keyframes spin{to{transform:rotate(360deg)}}
.base{background:conic-gradient(#6f4a2d,#3d2412,#6f4a2d)}
.milk{background:conic-gradient(#fff,#e7dcc7,#fff)}
.honey{background:conic-gradient(#ffcc66,#c9952f,#ffcc66)}

/* ---------- SPOON ---------- */
.spoon{
  position:absolute;
  width:10px;height:120px;
  left:50%;top:12px;
  transform-origin:bottom center;
  background:linear-gradient(to right,#ffdca8,#cfa86a,#ffdca8);
  border-radius:8px;
  filter:blur(.4px);
  display:none;
}
@keyframes stir{
  0%{transform:rotate(-12deg)}
  50%{transform:rotate(12deg)}
  100%{transform:rotate(0)}
}

/* ---------- CODEX ---------- */
#codex{
  position:fixed;
  bottom:-320px;
  left:50%;
  transform:translateX(-50%);
  width:420px;
  background:rgba(42,22,61,.97);
  border:1px solid var(--gold);
  border-radius:20px 20px 0 0;
  padding:18px;
  transition:.6s;
}
#codex.open{bottom:0}

/* ---------- MOBILE ---------- */
@media(max-width:768px){
  #game{grid-template-columns:1fr}
  #codex{width:95%}
}
</style>
</head>

<body>

<!-- NAME -->
<div id="nameOverlay" class="overlay">
  <div class="box">
    <h2>✦ STAR’S NOCTURNE CAFÉ ✦</h2>
    <p>Your name, apprentice?</p>
    <input id="nameInput" placeholder="Your name"
      style="width:100%;padding:10px;border-radius:12px;border:none;">
    <button onclick="start()">Enter the Café</button>
  </div>
</div>

<!-- PRAISE / TRANSITION -->
<div id="completeOverlay" class="overlay" style="display:none">
  <div class="box">
    <h2>✦ Apprenticeship Complete ✦</h2>
    <p id="praiseText"></p>
    <button onclick="enterMilo()">Enter Milo’s Garden 🌱</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div class="panel">
    <h3>MENU</h3>
    <div class="item" onclick="addBase('Lavender Tea')">Lavender Tea</div>
    <div class="item" onclick="addBase('Café Latte')">Café Latte</div>
    <hr>
    <div class="item" onclick="addInfusion('milk')">Milk</div>
    <div class="item" onclick="addInfusion('honey')">Honey</div>
  </div>

  <div class="panel">
    <h3>Your Cup</h3>
    <div class="cup-wrap">
      <div class="spoon" id="spoon"></div>
      <div class="cup" id="cup"><div class="steam"></div></div>
    </div>
    <button onclick="stir()">Stir</button>
    <button onclick="serve()">Serve</button>
  </div>

  <div class="panel">
    <h3>Customer</h3>
    <p id="order"></p>
    <p id="reaction"></p>
  </div>
</div>

<!-- CODEX -->
<div id="codex">
  <div onclick="toggleCodex()" style="cursor:pointer;color:var(--lav)">✦ Close Codex ✦</div>
  <h3>Completed Orders</h3>
  <div id="codexList"></div>
</div>

<script>
  const defaultWorldState = {
  playerName: localStorage.playerName || "Apprentice",
  gardenUnlocks: {
    lavender: false,
    chamomile: false,
    tea: false,
    coffee: false
  },
  cafeProgress: {
    customersServed: 0,
    apprenticeshipComplete: false
  }
};

let worldState = JSON.parse(localStorage.worldState || "null");
if(!worldState){
  worldState = defaultWorldState;
}

let name="",served=0;
let recipe=[],ready=false;
let currentOrder=[];
const bases=["Lavender Tea","Café Latte"];

function start(){
  name=document.getElementById("nameInput").value||"Apprentice";
  document.getElementById("nameOverlay").style.display="none";
  document.getElementById("game").style.display="grid";
  nextCustomer();
}

function nextCustomer(){
  recipe=[];ready=false;
  cup.innerHTML='<div class="steam"></div>';
  spoon.style.display="none";
  currentOrder=[bases[Math.floor(Math.random()*bases.length)]];
  order.textContent=`Customer ${served+1}: ${currentOrder[0]}`;
  reaction.textContent="";
}

function addBase(b){
  recipe=[b];
  spawn("base");
}
function addInfusion(t){
  recipe.push(t);
  spawn(t);
}
function spawn(cls){
  let s=document.createElement("div");
  s.className="swirl "+cls;
  cup.appendChild(s);
}

function stir(){
  if(ready||!recipe.length)return;
  spoon.style.display="block";
  spoon.style.animation="stir 1s ease-in-out 3";
  setTimeout(()=>{ready=true},3000);
}

function serve(){
  if(!ready){
    reaction.textContent="STAR: Stir with intention.";
    return;
  }
  if(recipe[0]!==currentOrder[0]){
    reaction.textContent="STAR: That is not what they ordered.";
    return;
  }
  served++;
  record(recipe[0]);
  if(served>=3){
    complete();
  }else{
    reaction.textContent="Customer: Thank you.";
    setTimeout(nextCustomer,1500);
  }
}

function record(drink){
  codex.classList.add("open");
  codexList.innerHTML+=`<div>✔ ${drink}</div>`;
}

function toggleCodex(){codex.classList.toggle("open");}

function complete(){
  document.getElementById("game").style.display="none";
  praiseText.innerHTML=
    `Well done, ${name}.<br>
     Three souls warmed by your hands.<br>
     Your apprenticeship is complete.`;
  document.getElementById("completeOverlay").style.display="flex";
}

function enterMilo(){
  window.location.href="milos-garden.html"; // YOUR link
}
</script>

</body>
</html>
