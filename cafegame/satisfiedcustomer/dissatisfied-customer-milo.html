<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STAR’s Nocturne Café</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#1b1026;
  --panel:#2a163d;
  --gold:#d8b46a;
  --lav:#cbb7ff;
  --text:#eee6ff;
}
body{
  margin:0;
  background:radial-gradient(circle at top,#2b1742,var(--bg));
  color:var(--text);
  font-family:Georgia,serif;
  overflow-y:auto;
}

/* ---------- OVERLAYS ---------- */
#namePrompt,#introChoice,#apprenticeScene,#confirmationCard{
  position:fixed; inset:0; display:flex;
  align-items:center; justify-content:center;
}
#namePrompt{background:rgba(0,0,0,.9); z-index:50;}
#introChoice{background:rgba(0,0,0,.88); z-index:40; display:none;}
#apprenticeScene{background:rgba(0,0,0,.85); z-index:35; display:none;}
#confirmationCard{background:rgba(0,0,0,.92); z-index:60; display:none;}

.intro-box,.apprentice-box,.card{
  background:rgba(42,22,61,.96);
  border:1px solid var(--gold);
  border-radius:22px;
  padding:30px;
  max-width:420px;
  text-align:center;
}
.apprentice-box{display:flex; max-width:800px;}
.star-image{width:180px;border-radius:14px;margin-right:20px;}
.star-name{color:var(--gold);letter-spacing:2px;}
.continue{cursor:pointer;color:var(--lav);margin-top:14px;text-align:right}

/* ---------- BUTTONS ---------- */
button{
  margin-top:12px;
  padding:10px;
  width:100%;
  border-radius:14px;
  border:1px solid var(--lav);
  background:transparent;
  color:var(--lav);
  cursor:pointer;
}
button:hover{background:var(--lav);color:#1b1026;}
button.ghost{opacity:.7}

/* ---------- MENU ---------- */
#menu{
  display:none;
  padding:30px;
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:24px;
}
.panel{
  background:rgba(42,22,61,.9);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:20px;
}
.panel h3{text-align:center;color:var(--gold);letter-spacing:3px;}

.menu-item{
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  margin-bottom:8px;
  cursor:pointer;
}
.menu-item:hover{background:rgba(203,183,255,.2);}

/* ---------- CUP ---------- */
.cup-wrap{position:relative;width:220px;height:220px;margin:auto;}
.cup{
  position:absolute; inset:20px;
  border-radius:50%;
  border:2px solid var(--gold);
  overflow:hidden;
}
.cup.success{box-shadow:0 0 30px rgba(203,183,255,.6);}

.steam{
  position:absolute;top:-30px;left:50%;
  width:6px;height:40px;
  background:rgba(255,255,255,.6);
  animation:rise 2s infinite;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(0)}
  50%{opacity:1}
  100%{opacity:0;transform:translateY(-30px)}
}

/* ---------- SWIRLS ---------- */
.swirl{
  position:absolute; inset:-25%;
  border-radius:50%;
  mix-blend-mode:screen;
  animation:spin 12s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.swirl.base{background:conic-gradient(#7a4a28,#4b2b15,#7a4a28);}
.swirl.milk{background:conic-gradient(#fff,#e8dcc7,#fff);}
.swirl.honey{background:conic-gradient(#ffcc66,#c9952f,#ffcc66);}

/* ---------- ORBS ---------- */
.orb{
  position:absolute;width:14px;height:14px;border-radius:50%;
  animation:orbit 6s linear infinite;
}
.orb::after{
  content:"";position:absolute;inset:-4px;
  background:inherit;border-radius:50%;filter:blur(6px);
}
.orb.base{background:#7a4a28;}
.orb.milk{background:#fff6e6;}
.orb.honey{background:#ffcc66;}
@keyframes orbit{
  from{transform:rotate(0deg) translateX(40px)}
  to{transform:rotate(360deg) translateX(40px)}
}

/* ---------- SPOON ---------- */
.spoon{
  position:absolute;width:10px;height:130px;
  left:50%;top:10px;
  transform-origin:bottom center;
  background:linear-gradient(to right,
    rgba(255,215,160,.9),
    rgba(220,180,120,.7),
    rgba(255,215,160,.9));
  border-radius:10px;
  filter:blur(.4px);
  display:none;
}
.spoon::after{
  content:"";position:absolute;bottom:-6px;left:-4px;
  width:18px;height:18px;
  background:radial-gradient(circle,rgba(255,220,180,.8),transparent);
  border-radius:50%;filter:blur(2px);
}
@keyframes bobble{
  0%{transform:rotate(-12deg)}
  25%{transform:rotate(10deg)}
  50%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
  100%{transform:rotate(0)}
}

/* ---------- CODEX ---------- */
#codex{
  position:fixed;bottom:-360px;left:50%;
  transform:translateX(-50%);
  width:420px;
  background:rgba(42,22,61,.96);
  border:1px solid var(--gold);
  border-radius:20px 20px 0 0;
  padding:20px;
  transition:.6s;
}
#codex.open{bottom:0}

/* ---------- MOBILE ---------- */
@media(max-width:768px){
  #menu{grid-template-columns:1fr;}
  #codex{width:95%;}
}
</style>
</head>

<body>

<!-- NAME PROMPT -->
<div id="namePrompt">
  <div class="intro-box">
    <h2>✦ STAR AWAITS ✦</h2>
    <p>What name shall I call you?</p>
    <input id="playerNameInput" placeholder="Your name"
      style="width:100%;padding:10px;border-radius:12px;border:none;">
    <button onclick="confirmName()">Enter the Café</button>
  </div>
</div>

<!-- INTRO -->
<div id="introChoice">
  <div class="intro-box">
    <h2>✦ STAR’S NOCTURNE CAFÉ ✦</h2>
    <p>The kettle hums softly.</p>
    <button onclick="startTutorial()">Become an Apprentice</button>
    <button class="ghost" onclick="skipTutorial()">Skip the Ritual</button>
  </div>
</div>

<!-- APPRENTICE -->
<div id="apprenticeScene">
  <div class="apprentice-box">
    <img class="star-image" src="warmsmile.jpeg">
    <div>
      <div class="star-name">✦ STAR ✦</div>
      <div id="apprenticeText"></div>
      <div class="continue" onclick="nextStep()">Next →</div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="menu">
  <div class="panel">
    <h3>MENU</h3>
    <div class="menu-item" onclick="addBase('Lavender Tea')">Lavender Tea</div>
    <div class="menu-item" onclick="addBase('Café Latte')">Café Latte</div>
    <hr>
    <div class="menu-item" onclick="addInfusion('milk')">Milk</div>
    <div class="menu-item" onclick="addInfusion('honey')">Honey</div>
  </div>

  <div class="panel">
    <h3>Your Cup</h3>
    <div class="cup-wrap">
      <div class="spoon" id="spoon"></div>
      <div class="cup" id="cup"><div class="steam"></div></div>
    </div>
    <button onclick="stir()">Stir</button>
    <button onclick="serve()">Serve</button>
  </div>

  <div class="panel">
    <h3>Customer</h3>
    <p id="customerOrder"></p>
    <p id="customerReaction"></p>
  </div>
</div>

<!-- CODEX -->
<div id="codex">
  <div onclick="toggleCodex()" style="cursor:pointer;color:var(--lav)">✦ Close Codex ✦</div>
  <h3>Codex</h3>
  <div id="codexList"></div>
</div>

<!-- CONFIRMATION -->
<div id="confirmationCard">
  <div class="card">
    <h2>✦ STAR’S CAFÉ ✦</h2>
    <p>
      By kettle and moonlight,<br>
      <strong id="cardName"></strong><br>
      is recognized as an Official Apprentice.
    </p>
    <button onclick="downloadCard()">Download Membership Card</button>
    <button onclick="window.open('milo-garden.html','_blank')">Visit Milo’s Garden 🌱</button>
    <button onclick="restartCafe()">Restart Café</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let playerName="Apprentice";
let step=0,recipe=[],codex=[],served=0;
let stirred=false,ready=false,currentOrder=[];

const cup=document.getElementById("cup");
const spoon=document.getElementById("spoon");

function confirmName(){
  playerName=document.getElementById("playerNameInput").value||"Apprentice";
  document.getElementById("namePrompt").style.display="none";
  document.getElementById("introChoice").style.display="flex";
}

function getSteps(){
 return[
  `Welcome, ${playerName}. I am STAR.`,
  "Choose a base.",
  "Add infusions.",
  "Stir gently.",
  "Serve with intention."
 ];
}

function startTutorial(){
 introChoice.style.display="none";
 apprenticeScene.style.display="flex";
 nextStep();
}
function skipTutorial(){
 introChoice.style.display="none";
 menu.style.display="grid";
 generateOrder();
}
function nextStep(){
 const steps=getSteps();
 apprenticeText.textContent=steps[step++]||"Begin.";
 if(step>steps.length){
  apprenticeScene.style.display="none";
  menu.style.display="grid";
  generateOrder();
 }
}

function addBase(n){recipe=[n];spawn("base");}
function addInfusion(t){recipe.push(t);spawn(t);}
function spawn(t){
 let s=document.createElement("div");
 s.className="swirl "+t; cup.appendChild(s);
 let o=document.createElement("div");
 o.className="orb "+t; cup.appendChild(o);
}

function stir(){
 if(stirred) return;
 stirred=true;
 spoon.style.display="block";
 spoon.style.animation="bobble 1s ease-in-out 3";
 setTimeout(()=>{spoon.style.animation="none";ready=true;},3000);
}

function serve(){
 if(!ready){
  customerReaction.textContent="STAR: Patience, apprentice.";
  return;
 }
 if(recipe[0]!==currentOrder[0]){
  customerReaction.textContent="STAR: That is not what they asked for.";
  return;
 }
 served++;
 customerReaction.textContent=`Well done, ${playerName}.`;
 codex.push(recipe.join(", "));
 updateCodex();
 if(served>=3){showCard();return;}
 setTimeout(()=>{resetCup();generateOrder();},2000);
}

function resetCup(){
 recipe=[];stirred=false;ready=false;
 cup.innerHTML='<div class="steam"></div>';
 spoon.style.display="none";
}

function generateOrder(){
 const bases=["Lavender Tea","Café Latte"];
 currentOrder=[bases[Math.floor(Math.random()*bases.length)]];
 customerOrder.textContent="I would like "+currentOrder[0];
 customerReaction.textContent="";
}

function updateCodex(){
 codexList.innerHTML=codex.map((d,i)=>`<div>Drink ${i+1}: ${d}</div>`).join("");
 codex.classList.add("open");
}

function toggleCodex(){codex.classList.toggle("open");}

function showCard(){
 menu.style.display="none";
 cardName.textContent=playerName;
 confirmationCard.style.display="flex";
}

function restartCafe(){location.reload();}

function downloadCard(){
 html2canvas(document.querySelector(".card"))
 .then(c=>{
  let a=document.createElement("a");
  a.href=c.toDataURL();
  a.download="STAR_Cafe_Membership.png";
  a.click();
 });
}
</script>

</body>
</html>
